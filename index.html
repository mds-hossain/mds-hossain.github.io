<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Shakhawat - Portfolio</title>
  <meta name="description" content="Portfolio of Md Shakhawat Hossain - Software QA & UX Engineer, HCAI Researcher." />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root[data-theme="dark"] {
      --bg: #09090c; --bg-soft: #111117; --panel: rgba(19,19,28,0.82);
      --panel-strong: #13131c; --card: #111119; --card-2: #151520;
      --text: #f2f3f7; --muted: #a4a8b8; --muted-2: #73798f;
      --line: rgba(255,255,255,0.08); --line-2: rgba(255,255,255,0.14);
      --accent: #8b7cff; --accent-2: #5eead4; --accent-3: #60a5fa;
      --tag-bg: rgba(139,124,255,0.12); --tag-text: #c9c1ff;
      --hero-glow: rgba(139,124,255,0.18);
      --shadow: 0 20px 60px rgba(0,0,0,0.35);
      --logo-bg: linear-gradient(135deg,#8b7cff,#60a5fa);
    }
    :root[data-theme="light"] {
      --bg: #f6f7fb; --bg-soft: #eef1f7; --panel: rgba(255,255,255,0.8);
      --panel-strong: #ffffff; --card: #ffffff; --card-2: #f7f8fd;
      --text: #151826; --muted: #50576d; --muted-2: #768097;
      --line: rgba(15,23,42,0.08); --line-2: rgba(15,23,42,0.14);
      --accent: #6d5efc; --accent-2: #0f766e; --accent-3: #2563eb;
      --tag-bg: rgba(109,94,252,0.1); --tag-text: #5140d8;
      --hero-glow: rgba(109,94,252,0.10);
      --shadow: 0 18px 48px rgba(44,62,100,0.12);
      --logo-bg: linear-gradient(135deg,#6d5efc,#2563eb);
    }
    *{box-sizing:border-box;margin:0;padding:0;}
    html{scroll-behavior:smooth;}
    body{font-family:'Inter',sans-serif;background:radial-gradient(circle at top right,var(--hero-glow),transparent 28%),var(--bg);color:var(--text);line-height:1.65;overflow-x:hidden;}
    body::before{content:"";position:fixed;inset:0;background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:44px 44px;opacity:0.35;mask-image:radial-gradient(circle at center,black 35%,transparent 90%);pointer-events:none;z-index:0;}
    a{color:inherit;text-decoration:none;}
    img{max-width:100%;display:block;}
    .wrap{width:min(1180px,calc(100% - 2rem));margin:0 auto;position:relative;z-index:1;}
    .topbar{position:fixed;top:0;left:0;right:0;z-index:200;backdrop-filter:blur(18px);background:color-mix(in srgb,var(--bg) 78%,transparent);border-bottom:1px solid var(--line);}
    .topbar-inner{height:72px;display:flex;align-items:center;justify-content:space-between;gap:1rem;}
    .brand{display:inline-flex;align-items:center;gap:0.85rem;font-weight:700;letter-spacing:-0.02em;}
    .brand-mark{width:38px;height:38px;border-radius:12px;background:var(--logo-bg);display:inline-flex;align-items:center;justify-content:center;color:white;font-weight:800;font-size:0.95rem;}
    .top-actions{display:flex;align-items:center;gap:0.7rem;}
    .control-btn,.menu-btn{border:1px solid var(--line-2);background:var(--panel);color:var(--text);border-radius:12px;height:42px;padding:0 0.9rem;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;transition:0.25s ease;font-weight:600;}
    .control-btn:hover,.menu-btn:hover{border-color:var(--accent);transform:translateY(-1px);}
    .control-btn{min-width:74px;font-size:0.84rem;}
    .menu-btn{width:46px;padding:0;position:relative;}
    .menu-btn .bars,.menu-btn .bars::before,.menu-btn .bars::after{content:"";width:18px;height:2px;background:var(--text);border-radius:4px;position:absolute;transition:0.25s ease;}
    .menu-btn .bars::before{transform:translateY(-6px);}
    .menu-btn .bars::after{transform:translateY(6px);}
    .menu-btn.active .bars{background:transparent;}
    .menu-btn.active .bars::before{transform:rotate(45deg);}
    .menu-btn.active .bars::after{transform:rotate(-45deg);}
    .drawer{position:fixed;top:72px;right:1rem;width:min(340px,calc(100vw - 2rem));background:var(--panel-strong);border:1px solid var(--line-2);border-radius:20px;box-shadow:var(--shadow);padding:1.1rem;z-index:199;opacity:0;transform:translateY(-10px);pointer-events:none;transition:0.25s ease;}
    .drawer.open{opacity:1;transform:translateY(0);pointer-events:auto;}
    .drawer-title{font-size:0.76rem;text-transform:uppercase;letter-spacing:0.14em;color:var(--muted-2);margin-bottom:1rem;font-family:'JetBrains Mono',monospace;}
    .drawer-nav{display:flex;flex-direction:column;gap:0.55rem;}
    .drawer-link{padding:0.9rem 1rem;border-radius:14px;background:var(--card-2);border:1px solid transparent;transition:0.2s ease;display:flex;justify-content:space-between;gap:1rem;align-items:center;}
    .drawer-link:hover{border-color:var(--accent);}
    .drawer-link span:last-child{color:var(--muted-2);font-size:0.8rem;}
    .hero{padding:120px 0 64px;min-height:100vh;display:flex;align-items:center;}
    .hero-grid{display:grid;grid-template-columns:1.2fr 0.8fr;gap:2rem;align-items:end;}
    .eyebrow{display:inline-flex;align-items:center;gap:0.6rem;padding:0.45rem 0.8rem;border-radius:999px;border:1px solid var(--line-2);background:var(--panel);color:var(--muted);font-size:0.76rem;font-family:'JetBrains Mono',monospace;margin-bottom:1.2rem;}
    .eyebrow::before{content:"";width:8px;height:8px;border-radius:999px;background:var(--accent-2);box-shadow:0 0 12px color-mix(in srgb,var(--accent-2) 70%,transparent);}
    .hero h1{font-size:clamp(2.9rem,7vw,5.7rem);line-height:0.96;letter-spacing:-0.05em;margin-bottom:1rem;max-width:10ch;}
    .hero h1 .grad{background:linear-gradient(135deg,var(--accent),var(--accent-3));-webkit-background-clip:text;background-clip:text;color:transparent;}
    .hero p.lead{max-width:60ch;font-size:1.05rem;color:var(--muted);margin-bottom:1.6rem;}
    .hero-actions{display:flex;flex-wrap:wrap;gap:0.85rem;margin-bottom:2rem;}
    .btn{height:48px;padding:0 1.1rem;border-radius:14px;display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--line-2);transition:0.2s ease;font-weight:600;}
    .btn.primary{background:linear-gradient(135deg,var(--accent),var(--accent-3));color:white;border-color:transparent;box-shadow:var(--shadow);}
    .btn.secondary{background:var(--panel);color:var(--text);}
    .btn:hover{transform:translateY(-1px);}
    .hero-metrics{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1rem;}
    .metric{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:1rem;min-height:110px;}
    .metric strong{display:block;font-size:1.7rem;line-height:1;margin-bottom:0.45rem;letter-spacing:-0.04em;}
    .metric span{color:var(--muted);font-size:0.92rem;}
    .hero-card{background:linear-gradient(180deg,color-mix(in srgb,var(--panel-strong) 90%,transparent),var(--card));border:1px solid var(--line);border-radius:28px;padding:1.35rem;box-shadow:var(--shadow);}
    .hero-card-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:1rem;color:var(--muted-2);font-size:0.82rem;font-family:'JetBrains Mono',monospace;}
    .hero-card h3{font-size:1.2rem;margin-bottom:0.45rem;}
    .hero-card p{color:var(--muted);font-size:0.96rem;margin-bottom:1.2rem;}
    .mini-list{display:grid;gap:0.75rem;}
    .mini-item{padding:0.9rem 1rem;border-radius:16px;background:var(--card-2);border:1px solid var(--line);}
    .mini-item b{display:block;margin-bottom:0.15rem;font-size:0.93rem;}
    .mini-item span{color:var(--muted);font-size:0.86rem;}
    section{padding:80px 0;}
    .section-label{font-size:0.75rem;font-family:'JetBrains Mono',monospace;text-transform:uppercase;letter-spacing:0.16em;color:var(--accent);margin-bottom:0.6rem;}
    .section-title{font-size:clamp(1.8rem,4vw,2.6rem);letter-spacing:-0.04em;margin-bottom:0.5rem;}
    .section-sub{color:var(--muted);max-width:55ch;margin-bottom:2.5rem;}
    .grid-2{display:grid;grid-template-columns:repeat(2,1fr);gap:1.5rem;}
    .grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:1.2rem;}
    .card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:1.4rem;transition:0.25s ease;}
    .card:hover{border-color:var(--accent);transform:translateY(-3px);box-shadow:var(--shadow);}
    .card-icon{width:44px;height:44px;border-radius:14px;background:var(--tag-bg);display:flex;align-items:center;justify-content:center;font-size:1.3rem;margin-bottom:1rem;}
    .card h3{font-size:1rem;margin-bottom:0.4rem;}
    .card p{color:var(--muted);font-size:0.9rem;line-height:1.55;}
    .tag{display:inline-flex;padding:0.3rem 0.7rem;border-radius:999px;background:var(--tag-bg);color:var(--tag-text);font-size:0.78rem;font-weight:500;}
    .tags{display:flex;flex-wrap:wrap;gap:0.4rem;margin-top:0.8rem;}
    .timeline{display:grid;gap:0;position:relative;}
    .timeline::before{content:"";position:absolute;left:18px;top:0;bottom:0;width:2px;background:var(--line-2);}
    .tl-item{display:grid;grid-template-columns:40px 1fr;gap:1.2rem;padding-bottom:2.2rem;position:relative;}
    .tl-dot{width:12px;height:12px;border-radius:999px;background:var(--accent);border:3px solid var(--bg);margin-top:6px;position:relative;z-index:1;justify-self:center;}
    .tl-body{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:1.2rem;}
    .tl-body:hover{border-color:var(--line-2);}
    .tl-meta{font-size:0.8rem;color:var(--muted-2);font-family:'JetBrains Mono',monospace;margin-bottom:0.4rem;}
    .tl-body h3{font-size:1rem;margin-bottom:0.2rem;}
    .tl-body .org{color:var(--accent);font-size:0.88rem;margin-bottom:0.6rem;}
    .tl-body ul{color:var(--muted);font-size:0.88rem;padding-left:1.1rem;display:grid;gap:0.3rem;}
    .cert-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:1rem;}
    .cert-card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:1rem 1.1rem;transition:0.2s ease;}
    .cert-card:hover{border-color:var(--accent);}
    .cert-card .issuer{font-size:0.76rem;color:var(--accent);font-weight:600;margin-bottom:0.3rem;font-family:'JetBrains Mono',monospace;}
    .cert-card h4{font-size:0.9rem;margin-bottom:0.2rem;}
    .cert-card .date{font-size:0.78rem;color:var(--muted-2);}
    .pub-card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:1.6rem;transition:0.25s ease;}
    .pub-card:hover{border-color:var(--accent);}
    .pub-card .venue{font-size:0.78rem;color:var(--accent);font-family:'JetBrains Mono',monospace;margin-bottom:0.5rem;}
    .pub-card h3{font-size:1.05rem;margin-bottom:0.6rem;line-height:1.4;}
    .pub-card p{color:var(--muted);font-size:0.9rem;margin-bottom:1rem;}
    .pub-card a{color:var(--accent-3);font-size:0.88rem;font-weight:600;}
    .contact-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:1rem;}
    .contact-item{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:1rem;}
    .contact-item small{font-size:0.75rem;color:var(--muted-2);font-family:'JetBrains Mono',monospace;display:block;margin-bottom:0.3rem;}
    .contact-item div{font-size:0.9rem;font-weight:500;word-break:break-all;}
    .site-link{display:inline-flex;align-items:center;gap:0.4rem;padding:0.6rem 1.1rem;border-radius:12px;border:1px solid var(--line-2);background:var(--panel);font-size:0.88rem;font-weight:600;transition:0.2s ease;}
    .site-link:hover{border-color:var(--accent);color:var(--accent);}
    footer{padding:2rem 0;border-top:1px solid var(--line);color:var(--muted-2);font-size:0.85rem;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:1rem;}
    @media(max-width:860px){
      .hero-grid{grid-template-columns:1fr;}
      .hero-metrics{grid-template-columns:repeat(2,1fr);}
      .grid-2,.grid-3{grid-template-columns:1fr;}
    }
    @media(max-width:520px){
      .hero-metrics{grid-template-columns:1fr;}
    }
  </style>
</head>
<body>
<nav class="topbar">
  <div class="wrap topbar-inner">
    <a href="#" class="brand">
      <span class="brand-mark">S</span>
      <span class="brand-name">Shakhawat</span>
    </a>
    <div class="top-actions">
      <button class="control-btn" id="langBtn" onclick="toggleLang()">DE</button>
      <button class="control-btn" id="themeBtn" onclick="toggleTheme()">Light</button>
      <button class="menu-btn" id="menuBtn" onclick="toggleMenu()" aria-label="Menu">
        <span class="bars"></span>
      </button>
    </div>
  </div>
</nav>
<div class="drawer" id="drawer">
  <div class="drawer-title">Navigation</div>
  <nav class="drawer-nav">
    <a class="drawer-link" href="#experience" onclick="toggleMenu()"><span>Experience</span><span>Work</span></a>
    <a class="drawer-link" href="#education" onclick="toggleMenu()"><span>Education</span><span>Study</span></a>
    <a class="drawer-link" href="#skills" onclick="toggleMenu()"><span>Skills</span><span>Tech</span></a>
    <a class="drawer-link" href="#projects" onclick="toggleMenu()"><span>Projects</span><span>Work</span></a>
    <a class="drawer-link" href="#certifications" onclick="toggleMenu()"><span>Certifications</span><span>Certs</span></a>
    <a class="drawer-link" href="#publication" onclick="toggleMenu()"><span>Publication</span><span>Research</span></a>
    <a class="drawer-link" href="#leadership" onclick="toggleMenu()"><span>Leadership</span><span>ECA</span></a>
    <a class="drawer-link" href="#awards" onclick="toggleMenu()"><span>Awards</span><span>Honours</span></a>
    <a class="drawer-link" href="#contact" onclick="toggleMenu()"><span>Contact</span><span>Get in touch</span></a>
  </nav>
</div>
